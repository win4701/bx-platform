<section class="swap-container" id="bloxioSwap">
<header class="swap-header">
<div>
<span class="swap-eyebrow">BLOXIO EXCHANGE</span>
<h2>Swap Engine</h2>
<p class="swap-subtitle">BX <span>•</span> XBC</p>
</div>
<div class="swap-live-status">
<span class="status-dot"></span>
Swap Ready
</div>
</header>
<div class="swap-content">
<!-- FROM PANEL -->
<div class="swap-panel">
<div class="swap-panel-heading">
<label>From</label>
<span class="panel-description">You pay</span>
</div>
<div class="token-selector" role="radiogroup" aria-label="Select sending token">
<label class="token-card">
<input type="radio" name="swapFrom" value="BX" checked>
<span class="token-card-content">
<img class="token-icon" src="/assets/images/coins/bx.png" alt="BX">
<span class="token-info">
<strong>BX</strong>
<small>Bloxio Token</small>
</span>
<span class="token-check"></span>
</span>
</label>
<label class="token-card">
<input type="radio" name="swapFrom" value="XBC">
<span class="token-card-content">
<img class="token-icon" src="/assets/images/coins/xbc.png" alt="XBC">
<span class="token-info">
<strong>XBC</strong>
<small>Bloxio Casino Token</small>
</span>
<span class="token-check"></span>
</span>
</label>
</div>
<div class="swap-amount-box">
<label for="swapAmount">Amount</label>
<input type="number" id="swapAmount" min="0" step="any" placeholder="0.00" inputmode="decimal" autocomplete="off">
<span class="amount-currency" id="fromCurrency">BX</span>
</div>
<div class="swap-panel-footer">
<span>Market value</span>
<strong id="fromUsdValue">$0.00</strong>
</div>
</div>
<div class="swap-direction" aria-hidden="true">
<span>↓</span>
</div>
<!-- TO PANEL -->
<div class="swap-panel">
<div class="swap-panel-heading">
<label>To</label>
<span class="panel-description">You receive</span>
</div>
<div class="token-selector" role="radiogroup" aria-label="Select receiving token">
<label class="token-card">
<input type="radio" name="swapTo" value="BX">
<span class="token-card-content">
<img class="token-icon" src="/assets/images/coins/bx.png" alt="BX">
<span class="token-info">
<strong>BX</strong>
<small>Bloxio Token</small>
</span>
<span class="token-check"></span>
</span>
</label>
<label class="token-card">
<input type="radio" name="swapTo" value="XBC" checked>
<span class="token-card-content">
<img class="token-icon" src="/assets/images/coins/xbc.png" alt="XBC">
<span class="token-info">
<strong>XBC</strong>
<small>Bloxio Casino Token</small>
</span>
<span class="token-check"></span>
</span>
</label>
</div>
<div class="swap-amount-box receive-box">
<label for="swapReceive">Estimated receive</label>
<input type="text" id="swapReceive" placeholder="0.00" readonly aria-live="polite">
<span class="amount-currency" id="toCurrency">XBC</span>
</div>
<div class="swap-panel-footer">
<span>Estimated value</span>
<strong id="toUsdValue">$0.00</strong>
</div>
</div>
<div class="swap-details">
<div class="swap-detail-row">
<span>Exchange Rate</span>
<strong id="swapRate">1 BX = 300 XBC</strong>
</div>
<div class="swap-detail-row">
<span>Swap Fee</span>
<strong>0.30%</strong>
</div>
<div class="swap-detail-row">
<span>Slippage</span>
<strong>0.50%</strong>
</div>
<div class="swap-detail-row">
<span>Total Deduction</span>
<strong id="swapDeduction">0.80%</strong>
</div>
<div class="swap-detail-row swap-detail-total">
<span>Minimum Received</span>
<strong id="swapMinimum">0.00</strong>
</div>
</div>
<div class="swap-message" id="swapMessage" role="status" aria-live="polite" hidden></div>
<!-- Execute -->
<button type="button" class="swap-btn" id="executeSwap">
<span>Execute Swap</span>
<span class="swap-btn-arrow">→</span>
</button>
<p class="swap-disclaimer">Estimated conversion only.</p>
</div>
<div class="swap-toast" id="swapToast" role="status" aria-live="polite"></div>
</section>
