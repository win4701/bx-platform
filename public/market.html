<section id="market" class="view">

<div class="market-shell">

</div>

<div class="market-header-right">

<span class="market-live-dot"></span>

<span>LIVE</span>

</div>

</div>

</div>

<div class="market-assets-selector">

<div class="market-assets-scroll">

<button class="market-asset" data-pair="BX/ETH"><img src="/assets/images/coins/eth.png" alt="ETH"><span>ETH</span></button>

<button class="market-asset" data-pair="BX/LTC"><img src="/assets/images/coins/ltc.png" alt="LTC"><span>LTC</span></button>
<button class="market-asset" data-pair="BX/BCH"><img src="/assets/images/coins/bch.png" alt="BCH"><span>BCH</span></button>
<button class="market-asset" data-pair="BX/USDT"><img src="/assets/images/coins/usdt.png" alt="USDT"><span>USDT</span></button>

<button class="market-asset" data-pair="BX/LINK"><img src="/assets/images/coins/link.png" alt="LINK"><span>LINK</span></button>
<button class="market-asset" data-pair="BX/DASH"><img src="/assets/images/coins/dash.png" alt="DASH"><span>DASH</span></button>
<button class="market-asset" data-pair="BX/XMR"><img src="/assets/images/coins/xmr.png" alt="XMR"><span>XMR</span></button>

</div>

</div>

<div class="market-stats-bar">

<div class="market-stat">

<span>PAIR</span>

<strong id="marketPair">BX/BTC</strong>

</div>

<div class="market-stat">

<span>PRICE</span>

<strong id="marketPrice">0.00000000</strong>

</div>

<div class="market-stat">

<span>CHANGE</span>

<strong id="marketChange">0.00%</strong>

</div>

<div class="market-stat">

<span>VOLUME</span>

<strong id="marketVolume">$0</strong>

</div>

<div class="market-stat">

<span>SPREAD</span>

<strong id="spread">0.00%</strong>

</div>

</div>

<div class="market-pair-engine">

<input id="marketSearch" class="market-search" type="search" placeholder="Search Pair">

</div>

<div class="market-chart-shell">

<div class="market-chart-toolbar">

<button class="chart-time active">1M</button>
<button class="chart-time">5M</button>
<button class="chart-time">15M</button>
<button class="chart-time">1H</button>
<button class="chart-time">4H</button>
<button class="chart-time">1D</button>
<button class="chart-time">1W</button>

</div>

<div id="marketChart"></div>

<div id="marketTooltip" class="hidden"></div>

</div>

<div class="market-mobile-tabs">

<button class="market-mobile-tab active" data-tab="trade">TRADE</button>

<button class="market-mobile-tab" data-tab="book">BOOK</button>

<button class="market-mobile-tab" data-tab="history">HISTORY</button>

<button class="market-mobile-tab" data-tab="intel">INTEL</button>

</div>

<div class="market-grid">

<div class="market-trade-column">

<section id="tradeBox" class="market-card">

<div class="trade-head">

<h3>BX Trading</h3>

</div>

<div class="trade-tabs">

<button id="buyTab" class="trade-tab active">BUY BX</button>

<button id="sellTab" class="trade-tab">SELL BX</button>

</div>

<div class="trade-form">

<input id="orderAmount" class="market-input" type="number" placeholder="Amount">

<input id="execPrice" class="market-input" type="number" placeholder="Execution Price">

<input id="orderTotal" class="market-input" type="number" placeholder="Total" readonly>

<button id="actionBtn" class="btn primary">EXECUTE ORDER</button>

</div>

</section>

</div>

<div class="market-book-column">

<section class="market-card">

<div class="trade-head">

<h3>Order Book</h3>

</div>

<div id="orderBookGrid"></div>

</section>

</div>

</div>

<section class="market-history-section market-card">

<div class="trade-head">

<h3>Trade History</h3>

</div>

<div id="tradeHistoryGrid"></div>

</section>

<section class="market-intel-section market-card">

<div class="trade-head">

<h3>Market Intel</h3>

</div>

<div class="market-intel-grid">

<div class="market-intel-item">

<span>Trend</span>

<strong id="marketTrend">Bullish</strong>

</div>

<div class="market-intel-item">

<span>Sentiment</span>

<strong id="marketSentiment">Positive</strong>

</div>

<div class="market-intel-item">

<span>Volatility</span>

<strong id="marketVolatility">Medium</strong>

</div>

<div class="market-intel-item">

<span>Liquidity</span>

<strong id="marketLiquidity">Strong</strong>

</div>

</div>

</section>

</div>
